<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Carta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:transparent;display:flex;align-items:flex-start;justify-content:center;padding:6px}
.card{width:340px;background:#120c0d;border:1px solid var(--c,#a8312a);border-top:4px solid var(--c,#a8312a);
 border-radius:8px;padding:14px 16px;color:#d8cdbb;box-shadow:0 18px 50px rgba(0,0,0,.75),0 0 30px color-mix(in srgb,var(--c,#a8312a) 30%,transparent);
 animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.k{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:#8a7d6a;margin-bottom:3px}
h1{font-size:18px;color:var(--c,#a8312a);margin-bottom:6px}
p{font-size:12.5px;line-height:1.55;color:#c4b8a4;max-height:150px;overflow:auto}
.p{margin-top:10px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a7d6a;display:flex;justify-content:space-between;align-items:center}
button{font-family:inherit;background:none;border:1px solid #2a2320;color:#8a7d6a;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
button:hover{border-color:var(--c,#a8312a);color:#d8cdbb}
</style></head><body>
<div class="card" id="card">
  <div class="k" id="t"></div><h1 id="n"></h1><p id="x"></p>
  <div class="p"><span id="p"></span><button id="ok">fechar</button></div>
</div>
<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
const q=new URLSearchParams(location.search);
const set=(id,v)=>document.getElementById(id).textContent=v||'';
set('t',q.get('t'));set('n',q.get('n'));set('x',q.get('x'));set('p',q.get('p'));
document.getElementById('card').style.setProperty('--c',q.get('c')||'#a8312a');
async function close(){ try{ if(OBR.isAvailable){await new Promise(r=>OBR.onReady(r)); await OBR.popover.close('com.boca-do-mundo/card');} }catch(e){} }
document.getElementById('ok').onclick=close;
setTimeout(close,12000);
</script></body></html>
