<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Boca do Mundo — Mesa do Mestre</title>
<style>
:root{--void:#0a0708;--void2:#120c0d;--panel:#161012;--bone:#d8cdbb;--dim:#8a7d6a;
--blood:#a8312a;--blood2:#c0352e;--deep:#5e1a16;--bile:#c9a24a;--hope:#5b8bd4;
--ash:#2a2320;--ok:#7faa4a;--roxo:#b070c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void);color:var(--bone);font-family:Georgia,serif;font-size:14px}
body{padding:12px;background:radial-gradient(120% 60% at 50% -10%,rgba(94,26,22,.35),transparent 60%),var(--void)}
button{font-family:inherit;cursor:pointer;color:var(--bone);background:none;border:1px solid var(--ash);border-radius:4px;transition:all .25s}
button:hover{border-color:var(--blood)}
.small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.btn{border:1px solid var(--blood);padding:8px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;background:rgba(168,49,42,.08)}
.btn:hover{background:rgba(168,49,42,.2)}
.btn.gold{border-color:var(--bile);background:rgba(201,162,74,.08)}
h1{font-size:17px;text-transform:uppercase;color:var(--blood2);margin-bottom:2px}
.tabs{display:flex;gap:5px;margin:12px 0}
.tabs button{flex:1;padding:8px 2px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-radius:4px}
.tabs button.on{background:var(--blood);border-color:var(--blood);color:#fff}
.tab{display:none}.tab.on{display:block}
/* medo */
.fearbox{border:1px solid var(--deep);border-radius:6px;background:var(--panel);padding:14px;text-align:center;margin-bottom:12px}
.fearbox .fv{font-size:52px;font-weight:700;color:var(--blood2);line-height:1;text-shadow:0 0 26px rgba(168,49,42,.5)}
.fearbox .fl{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:4px 0 10px}
.fearbox .row{display:flex;gap:7px;justify-content:center}
.fearbox .row button{width:44px;height:38px;font-size:18px}
/* fome */
.fome{border:1px solid var(--ash);border-radius:6px;background:var(--panel);padding:12px;margin-bottom:12px;text-align:center}
.segs{display:flex;gap:9px;justify-content:center;margin-top:9px}
.seg{width:17px;height:17px;border:1px solid var(--deep);background:#0c0707;transform:rotate(45deg);cursor:pointer;transition:all .3s}
.seg.on{background:var(--blood);box-shadow:0 0 10px rgba(168,49,42,.6)}
.seg:hover{border-color:var(--bone)}
/* alvo de rolagem */
.target{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.target button{flex:1;padding:7px;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.target button.on{background:var(--bile);border-color:var(--bile);color:#120c0d}
/* inimigos/chefes */
.en{border:1px solid var(--ash);border-left:3px solid var(--blood);border-radius:4px;background:var(--panel);margin-bottom:9px;padding:10px 12px}
.en.boss{border-left-color:var(--bile)}
.en .hd{display:flex;align-items:baseline;gap:8px}
.en .hd b{font-size:14px;flex:1}
.en .hd span{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.en .st{font-family:'Courier New',monospace;font-size:10px;color:var(--blood2);margin:4px 0 6px}
.en.boss .st{color:var(--bile)}
.en .vox{font-style:italic;font-size:11px;color:var(--dim);border-left:2px solid var(--ash);padding-left:8px;margin-bottom:7px;line-height:1.45}
.atk{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.atk .an{flex:1;font-size:11.5px;line-height:1.4}
.atk .an b{color:var(--bone)}
.atk .an span{color:#b4a890}
.atk button{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;white-space:nowrap}
.rollbtn{border-color:var(--blood2);color:var(--blood2)}
.rollbtn:hover{background:rgba(192,53,46,.15)}
details.x{border-top:1px dashed var(--ash);margin-top:7px;padding-top:6px}
details.x summary{list-style:none;cursor:pointer;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
details.x summary::-webkit-details-marker{display:none}
details.x p,details.x li{font-size:11.5px;line-height:1.5;color:#c4b8a4;margin-top:5px}
details.x ul{list-style:none}
details.x li b{color:var(--bone)}
details.reveal summary{color:var(--bile)}
.rv-death{font-style:italic;border-left:2px solid var(--bile);padding-left:9px}
.rv-truth{background:rgba(201,162,74,.08);border-radius:4px;padding:8px 10px;margin-top:6px}
/* party */
.pj{border:1px solid var(--ash);border-left:3px solid var(--pc,#a8312a);border-radius:4px;background:var(--panel);padding:9px 11px;margin-bottom:8px}
.pj .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pj .hd b{font-size:13px;color:var(--pc)}
.pj .hd span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.bar .bl{width:64px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.bar .bb{flex:1;height:9px;background:#0d0a0b;border:1px solid var(--ash);border-radius:3px;overflow:hidden}
.bar .bf{height:100%;background:var(--bc);transition:width .4s}
.bar .bv{font-size:10px;color:var(--dim);min-width:30px;text-align:right}
.empty{text-align:center;color:var(--dim);font-size:11px;padding:18px;font-style:italic}
/* resultado de rolagem */
.lastroll{position:sticky;bottom:0;background:var(--void2);border:1px solid var(--blood);border-radius:5px;padding:8px 12px;font-size:12px;display:none;margin-top:10px}
.lastroll.on{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--deep);border:1px solid var(--blood);color:var(--bone);padding:8px 14px;border-radius:5px;font-size:12px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%;text-align:center}
.toast.on{opacity:1}
.demo-note{border:1px dashed var(--bile);color:var(--bile);border-radius:4px;font-size:10px;padding:7px 10px;margin-bottom:10px;display:none}
.dp-line{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center;margin-top:10px}
.dp-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--dim)}
.dp-dot.ok{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
</style></head><body>

<h1>Mesa do Mestre</h1>
<div class="small">A Boca do Mundo · Daggerheart</div>
<div class="demo-note" id="demoNote">Modo demonstração — fora do Owlbear.</div>

<div class="tabs">
  <button data-t="mesa" class="on">Mesa</button>
  <button data-t="party">Party</button>
  <button data-t="best">Bestiário</button>
  <button data-t="boss">Chefes</button>
</div>

<div class="tab on" id="tab-mesa">
  <div class="fearbox">
    <div class="fv" id="fearV">0</div>
    <div class="fl">Medo do Mestre</div>
    <div class="row">
      <button id="fMinus">−</button><button id="fPlus">+</button>
      <button class="btn gold" id="btnBanner" style="width:auto">Banner no topo: OFF</button>
    </div>
  </div>
  <div class="fome">
    <div class="small">Relógio da Fome <span id="fomeTxt"></span></div>
    <div class="segs" id="segs"></div>
  </div>
  <div class="target">
    <span class="small" style="flex:0 0 auto">Rolagens:</span>
    <button data-tg="everyone" class="on">Todos veem</button>
    <button data-tg="gm_only">Só o Mestre</button>
  </div>
  <div class="quick">
    <button class="btn" id="qTes">🎲 Tesouro (d20)</button>
    <button class="btn" id="qD20">🎲 d20 avulso</button>
  </div>
  <div class="lastroll" id="lastroll"></div>
  <div class="dp-line"><span class="dp-dot" id="dpDot"></span><span id="dpStat">Dice+: verificando…</span></div>
</div>

<div class="tab" id="tab-party"><div id="party"></div></div>
<div class="tab" id="tab-best"><div id="bestList"></div></div>
<div class="tab" id="tab-boss"><div id="bossList"></div></div>

<div class="toast" id="toast"></div>

<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
const DATA={"inimigos": [{"nome": "Lacaio do Vazio", "tier": "Patamar 1 · Lacaio", "stat": "Dif 12 · Lim —/— · PV 1 · ATQ +3", "hab": "Garras (perto, 1d6+2). Morre com 1 acerto. Vêm em grupos de 3-5. Ao morrer, sussurra o nome de um morto.", "vox": "Uma casca de sombra com dedos demais se desprende da parede e caminha. Onde deveria haver rosto, há só o breu.", "leitura": "Eles não têm rosto, só a sugestão de um — uma depressão escura onde deveria haver feições. Movem-se em silêncio, muitos de uma vez, como se a escuridão tivesse decidido andar.", "ataques": [["Garras Famintas", "perto · 1d6+2 físico. Ataque básico."], ["Maré de Sombras", "Quando 3+ Lacaios estão adjacentes ao mesmo alvo, somam o dano: cada um além do primeiro adiciona +2 ao acerto de um deles. Punem quem se isola."]], "habilidades": [["Enxame", "Vêm sempre em grupos de 3-5. Tratam-se como um Lacaio coletivo: o mestre pode mover todos com uma ação."], ["Sussurro Final", "Ao morrer, sussurra o nome de um morto ligado a um PJ próximo (mestre escolhe). Esse PJ marca 1 Estresse, a menos que o ignore deliberadamente (roleplay)."], ["Nascidos da Parede", "Brotam de qualquer superfície escura. Com a alavanca FOME, é o reforço padrão."]], "estrategia": "Use-os como pressão, não como ameaça mortal. Mande-os cercar o PJ mais isolado ou mais ferido, forçando o grupo a se reagrupar e proteger. Eles existem pra drenar ações e Esperança — cada turno gasto matando um Lacaio é um turno não gasto no perigo real da sala. Sacrifique-os sem dó: jogue-os na frente de ataques destinados a inimigos maiores. O Sussurro Final é psicológico — narre o nome com peso, deixe o jogador decidir se aquilo o abala."}, {"nome": "Eco Roubado", "tier": "Patamar 1", "stat": "Dif 13 · Lim 7/13 · PV 4 · PF 3 · ATQ +4", "hab": "Voz Alheia (distante, 2d6, fala como alguém que o alvo amava). Some se ninguém o escuta por 1 rodada.", "vox": "Uma figura translúcida toma forma, e quando ela fala, é com a voz de alguém que você enterrou. Ferir isso vai doer mais em você do que nela.", "leitura": "Translúcido, meio-formado, com a voz de alguém que um dos PJs amou e perdeu. Não ataca com ódio — ataca com saudade, e isso é pior.", "ataques": [["Toque que Lembra", "distante · 2d6 psíquico. Fala como o ente querido enquanto fere."], ["Coro de Saudade", "Uma vez por cena, todos os Ecos em campo falam juntos: cada PJ marca 1 Estresse e deve ter sucesso em Presença (13) ou perde a reação até seu próximo turno."]], "habilidades": [["Voz Roubada", "Para atacá-lo, o PJ precisa de sucesso em Presença (15) — ferir a 'voz' de quem se ama é difícil. Falha = perde a ação, paralisado."], ["Dissolução pela Escuta", "Se o grupo passar uma rodada inteira sem atacar, apenas ouvindo, o Eco se dissolve em paz (sem combate) e deixa uma última mensagem real."], ["Imune ao Esquecido", "Não pode ser ferido por quem 'não o reconhece' — um PJ sem laço com aquela voz erra sempre."]], "estrategia": "Esse inimigo é uma armadilha emocional disfarçada de combate. Não jogue pela vitória — jogue pela dúvida. Faça o Eco usar a voz do morto mais significativo de cada PJ, e narre frases que ELE diria. O objetivo é fazer a mesa hesitar. Se o grupo insistir em atacar, deixe doer (o teste de Presença); se alguém perceber que dá pra só ouvir, recompense com um momento catártico. Esse 'combate' é melhor quando termina sem sangue."}, {"nome": "Carniçal de Gancho", "tier": "Patamar 2", "stat": "Dif 15 · Lim 9/17 · PV 6 · PF 4 · ATQ +5", "hab": "Gancho de Osso (perto, 2d8+3, puxa o alvo). Se alimenta de carcaças divinas — regenera 1 PF perto delas.", "vox": "Magro, cinzento, faminto — e no lugar do braço, um gancho de osso comprido. Ele se alimenta dos deuses mortos, e agora olha pra vocês.", "leitura": "Magro como fome em pessoa, pele cinza esticada sobre ossos, e no lugar de um braço, um gancho de osso comprido e curvo que ele usa pra puxar a carne dos deuses mortos — e a sua.", "ataques": [["Gancho de Osso", "perto · 2d8+3 físico. Em acerto, puxa o alvo até si (corpo a corpo)."], ["Estripada", "muito perto · 3d6+4 físico. Só contra alvos que ele puxou na rodada anterior. O açougueiro adora um alvo preso."]], "habilidades": [["Banquete Divino", "Enquanto adjacente a uma carcaça de deus, recupera 1 PF no início de cada turno. Afastá-lo das carcaças é a chave do combate."], ["Cheiro de Sangue", "Tem vantagem em ataques contra o PJ com menos PV. Caça o ferido."], ["Reposicionar", "Uma vez por rodada, pode usar o gancho numa parede/carcaça pra se arrastar até alcance distante de graça."]], "estrategia": "Jogue o Carniçal como um predador territorial, não um brigão. Ele quer puxar alguém pra perto das carcaças (onde regenera) e estripar. A tática do grupo deve ser afastá-lo — então jogue contra isso: ele se arrasta de volta com o gancho, sempre buscando a carcaça mais próxima. Foque o PJ mais ferido (Cheiro de Sangue) pra forçar o grupo a defendê-lo. Se o grupo for esperto e incendiar/destruir as carcaças, deixe-o entrar em fúria (descreva o desespero), atacando mais arriscado."}, {"nome": "Corrente de Culpa", "tier": "Patamar 2", "stat": "Dif 16 · Lim 10/18 · PV 5 · PF 5 · ATQ +5", "hab": "Açoite (perto, 2d10, mira quem tem mais Estresse). Imune a dano físico de quem não a 'reconhece'.", "vox": "O ferro vivo se ergue do chão e se enrola como serpente. Em cada elo, um nome. Ela só pode ser ferida por quem aceita a culpa que ela carrega.", "leitura": "Ferro vivo brotando do chão como uma serpente de elos enferrujados, e em cada elo, gravado, um nome — nomes de gente que alguém ali não salvou. Ela range quando se move, e o range soa como uma acusação.", "ataques": [["Açoite", "perto · 2d10 físico. O chicote de elos atinge com o peso da culpa."], ["Enlaçar", "distante · 1d8 + Restringido. O alvo fica preso (não se move) até gastar uma ação ou um aliado cortar a corrente (Dif 14)."]], "habilidades": [["Culpa Nomeada", "Mira sempre o PJ com mais Estresse ou mais culpa narrativa. Imune a dano de quem 'não a reconhece' — só fere quem aceita a culpa que ela carrega (roleplay + mecânica)."], ["Nome Infundado", "Um elo tem o nome de alguém que um PJ salvou e esqueceu. Reconhecê-lo em voz alta quebra a corrente instantaneamente e devolve 1 Esperança."], ["Peso dos Mortos", "Cada PJ que cair perto dela faz a corrente ganhar +1 dano permanente naquele combate."]], "estrategia": "Esse inimigo é sobre confronto interno. Escolha um PJ-alvo (o de passado mais pesado) e mande a corrente persegui-lo especificamente, narrando os nomes nos elos como coisas que ELE conhece. O grupo vai perceber que força bruta não resolve — só aceitar a culpa fere a corrente. Conduza pra esse momento de roleplay. Se um jogador tentar a saída do 'Nome Infundado', recompense generosamente: é o coração da cena."}, {"nome": "Elemental de Fogo", "tier": "Patamar 2", "stat": "Dif 15 · Lim 11/20 · PV 7 · PF 4 · ATQ +5", "hab": "Labareda (muito perto, 2d8+4 fogo, incendeia). Apaga em água; cresce no calor da Fornalha.", "vox": "Das chamas, uma forma se levanta e dá um passo. O calor que ela emana sobe a cada segundo — ficar perto já é se queimar.", "leitura": "Uma forma humanoide feita de brasa e chama viva, erguendo-se da fornalha das almas. Onde pisa, a pedra racha e chia. O calor que emana faz o ar tremer e a pele arder à distância.", "ataques": [["Labareda", "muito perto · 2d8+4 fogo. Incendeia: o alvo sofre 1d4 fogo no início do próximo turno."], ["Erupção", "distante (área) · 2d6 fogo a todos num raio. Recarrega quando a sala esquenta o suficiente (3+ rodadas)."]], "habilidades": [["Aura de Brasa", "Todo PJ que termina o turno adjacente sofre 2 de fogo. A sala inteira esquenta +1 de dano de fogo cumulativo por rodada."], ["Sede de Água", "Apagar a fornalha (água, gelo, magia de frio) reduz seus PV pela metade e remove a Aura de Brasa. Vulnerável a dano de frio (dano dobrado)."], ["Alma Aprisionada", "Se dominado (Instinto 15, em vez de morto), liberta uma alma que ajuda o grupo por uma cena."]], "estrategia": "O Elemental é uma corrida contra o relógio: quanto mais dura o combate, mais quente (e letal) a sala fica. Jogue agressivo e pressione o grupo a agir rápido. Mas deixe a saída clara — a fornalha é o ponto fraco visível. Se o grupo for direto pra água/gelo, recompense com o enfraquecimento dramático. Se o Arauto (Feiticeiro de fogo) tentar dominá-lo, esse é um momento temático lindo — deixe-o brilhar. Use a Erupção quando o grupo se amontoar."}, {"nome": "Aranha-Memória", "tier": "Patamar 2", "stat": "Dif 14 · Lim 8/16 · PV 6 · PF 6 · ATQ +5", "hab": "Teia (distante, prende) + Mordida (perto, 2d6, rouba 1 lembrança). Foge se perde metade dos PV.", "vox": "Pálida, inchada, com olhos humanos demais nas costas. Ela tece, paciente. Não quer sua vida — quer arrancar quem você foi.", "leitura": "Pálida e inchada, do tamanho de um cão grande, com olhos humanos demais agrupados nas costas — olhos que piscam, que choram, que reconhecem você. Ela não tece pra comer. Tece pra colecionar quem você foi.", "ataques": [["Teia Prendedora", "distante · prende o alvo (Restringido). Teste de Acuidade (14) pra não enroscar ao se mover."], ["Mordida do Esquecimento", "perto · 2d6 + rouba 1 lembrança (o PJ perde 1 Experiência até o fim da sessão). O horror não é o dano."]], "habilidades": [["Colecionadora", "Memórias roubadas ficam presas na teia, visíveis. Cortá-las (Dif 14) devolve a Experiência — e às vezes liberta memórias de aliados mortos ou pistas."], ["Refúgio na Teia", "Move-se livremente pela própria teia, ignorando terreno. Tem vantagem contra quem está preso."], ["Fuga Covarde", "Ao perder metade dos PV, foge pra teia e tenta roubar mais uma memória antes de sumir. Não luta até a morte — é uma predadora calculista."]], "estrategia": "A Aranha é paciente e cruel. Não a jogue como um bicho burro — ela escolhe alvos, prende e drena, recuando pra teia entre os ataques. O drama está nas memórias presas (visíveis na teia): o grupo precisa decidir entre lutar e libertar lembranças. Mande-a mirar quem já perdeu memórias antes (Biblioteca, Quarto) pra criar continuidade. Quando ela fugir com metade da vida, deixe a ameaça pairando — ela pode voltar mais fundo na masmorra."}, {"nome": "Servo-Esqueleto", "tier": "Patamar 1 · Lacaio", "stat": "Dif 11 · Lim —/— · PV 1 · ATQ +3", "hab": "Lâmina Enferrujada (perto, 1d8). Era um aventureiro que desceu antes. Obedece o chefe que o criou.", "vox": "Ossos enferrujados de um aventureiro que desceu antes e nunca subiu se reerguem, ainda agarrados a uma lâmina corroída. Um aviso, e um inimigo.", "leitura": "Os ossos enferrujados de um aventureiro que desceu antes e nunca subiu, reerguidos pela Boca, ainda agarrados à lâmina corroída que não os salvou. Um aviso ambulante do que espera o grupo.", "ataques": [["Lâmina Enferrujada", "perto · 1d8 físico. Em acerto crítico, o alvo arrisca infecção (1 Estresse extra)."], ["Última Ordem", "Ao morrer, dá um último golpe no atacante (1d6) — a Boca não solta seus servos facilmente."]], "habilidades": [["Servo da Boca", "Obedece ao chefe ou à sala que o criou. Sob Coroa de Costelas, recebe +1 ATQ."], ["Remontável", "Com a alavanca FOME/ONDA, esqueletos caídos podem se reerguer (metade dos PV) se o grupo não 'quebrar os ossos' (ação extra)."], ["Memória do Equipamento", "Carrega um item do aventureiro morto (role na tabela d20 de tesouros, ou solte uma pista) — recompensa quem o derrota."]], "estrategia": "Use os Servos como tropa descartável com um toque de melancolia — cada um foi um aventureiro como os PJs. Narre detalhes (uma aliança no dedo ósseo, um brasão). Mecanicamente, são Lacaios que voltam se não forem 'quebrados', forçando o grupo a gastar ações extras. Ótimos sob o chefe Coroa de Costelas (que os fabrica) ou como reforço FOME. O item que cada um carrega dá um incentivo pra enfrentá-los em vez de fugir."}, {"nome": "Reflexo-Sombra", "tier": "= ficha do PJ", "stat": "Usa os atributos, PV e cartas do PJ que o invocou", "hab": "Espelha o PJ. Cai quando o original aceita a verdade que nega (roleplay) OU quando reduzido a 0 PV.", "vox": "Uma silhueta escura se descola de vocês e fica de pé. Ela tem o seu jeito de lutar, a sua ficha, os seus truques — e nenhuma das suas dúvidas.", "leitura": "Uma silhueta escura se descola de um dos PJs e fica de pé, com o mesmo jeito de lutar, os mesmos truques, a mesma ficha — mas nenhuma das suas hesitações. É você, se você nunca tivesse duvidado.", "ataques": [["Espelhamento", "Usa os MESMOS ataques e cartas do PJ espelhado, com os mesmos números. Conhece todas as suas táticas."], ["Golpe da Certeza", "1x por cena · o dano do próximo ataque é máximo (sem rolar). A versão sem dúvidas nunca erra a hora."]], "habilidades": [["Espelho Vivo", "Copia a ficha do PJ no momento em que se forma. Se o PJ usa uma carta, o Reflexo pode usar a mesma na rodada seguinte."], ["Sem Dúvida", "Imune a efeitos de medo, dúvida e psíquicos. É a parte do PJ que não treme."], ["Ferida Interna", "Vencer o Reflexo (combate OU diálogo — convencê-lo de que a dúvida tem valor) fecha uma ferida interna do PJ: +1 Esperança permanente e cura 1 cicatriz."]], "estrategia": "O Reflexo é um espelho mecânico e temático. Jogue-o exatamente como o PJ jogaria — use as mesmas combos, a mesma esperteza. A diferença é a frieza: ele faz a jogada ótima sem medo. Mas a vitória não precisa ser sangue: se o jogador argumentar que a dúvida o torna humano/melhor, permita resolver por roleplay. Escolha espelhar o PJ cujo defeito trágico está mais cru na mesa. É um duelo consigo mesmo — conduza como tal."}], "bosses": [{"n": 1, "nome": "A PRIMEIRA FOME", "conceito": "O apetite original da Boca, ganhou forma. Uma massa de bocas e mãos que devora o chão atrás de si.", "sb": {"Dif": 18, "Lim": "20/40", "PV": 12, "PF": 6, "ATQ": "+5", "arma": "Mordida Total (muito perto, 4d12+10)"}, "mec": "A cada turno devora 1 zona do mapa — quem fica sem chão cai no Vazio. Ao marcar 1º PV, ganha uma ação extra por rodada.", "vox": "Algo recém-nascido e antigo ao mesmo tempo se arrasta na sua direção — uma massa de bocas e mãos, ainda aprendendo a ter forma. A Primeira Fome.", "ataques": [["Mordida Total", "muito perto · 4d12+10. Devora tudo no alcance."], ["Língua Predadora", "distante · 2d10, puxa o alvo pra muito perto (pra próxima Mordida)."], ["Devorar o Chão", "área · destrói 1 zona do mapa por turno; quem fica sem chão cai no Vazio (apagado)."]], "fases": [["Recém-nascida", "Começa devorando o cenário, encurralando o grupo."], ["Faminta (1º limiar)", "Ao marcar o 1º PV, ganha uma ação extra por rodada e acelera a destruição do mapa."]], "estrategia": "A Primeira Fome não persegue PJs — devora o ESPAÇO. Jogue-a comendo o mapa de fora pra dentro, encurralando o grupo num pedaço cada vez menor. A tensão é espacial: a cada turno há menos chão. Force decisões rápidas. Use a Língua pra puxar quem se afasta demais. Ela não tem fraqueza tática óbvia — é pura pressão. O grupo vence resistindo até derrubá-la, ou achando uma saída antes de ficar sem chão.", "reveal_death": "Ao se desfazer, a Primeira Fome não grita — ela SUSPIRA, aliviada, como quem enfim pôde parar de comer.", "reveal_truth": "Você entende, tarde demais: a Boca não tem fome por maldade. Ela tem fome porque foi ENSINADA a ter, no instante em que a Deusa morreu querendo mais. A fome é uma ferida, não um pecado. E feridas, às vezes, podem ser saradas — não preenchidas."}, {"n": 2, "nome": "O DEUS QUE VOCÊ MATOU", "conceito": "A divindade que um dos PJs traiu/abandonou, agora um cadáver colossal animado pelo rancor.", "sb": {"Dif": 17, "Lim": "22/45", "PV": 11, "PF": 8, "ATQ": "+6", "arma": "Julgamento (distante, 3d20)"}, "mec": "Prioriza o PJ com vínculo divino (Serafim/Bardo). Imune a dano mágico do domínio Esplendor. Ressuscita 1 vez com metade dos PV.", "vox": "O cadáver se ergue, vasto, de pele dourada e rachada. Você conhece esse rosto. Você jurou nunca mais dizer esse nome. E ele desce com você.", "ataques": [["Julgamento", "distante · 3d20 psíquico contra o PJ que o traiu. Dói na alma, não na carne."], ["Mão do Deus Morto", "perto · 3d10+5, com Vulnerável em acerto."], ["Lembrança Acusatória", "área · cada PJ revive uma falha; marca 2 Estresse ou perde a ação."]], "fases": [["O Rancor", "Prioriza sempre o PJ com vínculo divino (Serafim/Bardo) ou quem o 'matou'."], ["Ressurreição (metade dos PV)", "Ressuscita 1 vez com metade dos PV — a fé traída não morre fácil."]], "estrategia": "Personalize-o ao PJ que o 'matou' (definido na criação). Ele ignora os outros sempre que pode — quer aquele PJ. Narre cada ataque como uma cobrança pessoal. Imune a dano mágico do domínio Esplendor (a fé não fere a fé). O grupo precisa proteger o alvo e quebrar a ressurreição. O clímax é o PJ encarar o que traiu — deixe espaço pra roleplay no meio da luta.", "reveal_death": "O deus morto te encara enquanto desaparece. 'Eu também desci', ele diz. 'Eu também queria salvar alguém.'", "reveal_truth": "Todo chefe aqui embaixo já foi como você: alguém que desceu por amor, culpa ou desespero, e ficou. A Boca não cria seus monstros — ela os RECRUTA, entre os que falharam em subir. O que espera no fundo não é um inimigo. É um espelho do que você pode virar."}, {"n": 3, "nome": "COROA DE COSTELAS", "conceito": "Um rei morto há eras, fundido ao seu trono de ossos, que coleciona almas dos que descem.", "sb": {"Dif": 18, "Lim": "20/42", "PV": 13, "PF": 5, "ATQ": "+5", "arma": "Decreto (perto, 3d12+8, atordoa)"}, "mec": "Cada PJ derrubado vira um servo-esqueleto (Patamar 1) que luta contra o grupo. Reduz dano sofrido pela metade enquanto tiver servos.", "vox": "No trono de ossos, o rei morto abre a caixa torácica como quem abre uma coroa. Ele coleciona almas há eras, e a sua já tem lugar marcado.", "ataques": [["Decreto", "perto · 3d12+8, atordoa em acerto crítico."], ["Convocar a Corte", "invoca 1d4 Servos-Esqueleto por rodada (sua corte de mortos)."], ["Peso da Coroa", "área · todos testam Presença (16) ou ajoelham (Restringido 1 rodada)."]], "fases": [["O Rei no Trono", "Fundido ao trono, não se move; comanda os Servos."], ["Coroa Erguida (1º limiar)", "Cada PJ derrubado vira um Servo-Esqueleto que luta contra o grupo. Reduz dano sofrido pela metade enquanto tiver Servos."]], "estrategia": "Ele é um chefe de atrito: enquanto tiver súditos, reduz o dano que sofre, então o grupo precisa decidir entre limpar os Servos ou focar o rei (e aguentar a corte). Jogue-o imóvel e arrogante, comandando do trono. A cada PJ que cai, ergue um novo Servo — narre o horror de lutar contra o aliado caído. A fraqueza: sem Servos, fica exposto. Force o grupo a essa escolha tática.", "reveal_death": "O rei de ossos larga a coroa antes de ruir. Pela primeira vez em eras, suas mãos estão vazias — e ele parece em paz.", "reveal_truth": "Ele colecionava almas porque tinha medo de ficar só no escuro. Toda a crueldade da Boca nasce desse mesmo medo, multiplicado: ela DEVORA para não ficar vazia. O Vazio e a Fome são a mesma coisa vista de dois lados — o nada que tem pavor de continuar sendo nada."}, {"n": 4, "nome": "A MÃE DAS MEMÓRIAS", "conceito": "A aranha-memória crescida ao máximo, tecida com as lembranças de todos que a Boca já comeu.", "sb": {"Dif": 17, "Lim": "18/38", "PV": 10, "PF": 9, "ATQ": "+5", "arma": "Fio do Esquecimento (distante, 2d12, rouba Experiência)"}, "mec": "Ao acertar, rouba 1 Experiência do alvo (ela usa contra vocês). PJ sem Experiências fica Vulnerável permanente.", "vox": "A aranha imensa se move, e nos fios do seu corpo há rostos — memórias presas, suas e de mil outros. Ela lembra por você. E no seu lugar.", "ataques": [["Fio do Esquecimento", "distante · 2d12, rouba 1 Experiência em acerto."], ["Casulo", "prende um PJ num casulo de memórias (Restringido + isolado até cortarem, Dif 15)."], ["Tecer o Passado", "cria uma ilusão de alguém que um PJ amava; o PJ hesita (perde ação) salvo sucesso em Presença 15)."]], "fases": [["A Tecelã", "Prende e drena, mantendo distância na teia."], ["Vazia de Memórias (metade dos PV)", "Começa a devolver memórias roubadas como projéteis — usa as lembranças do grupo contra ele."]], "estrategia": "A Mãe é uma controladora: prende, isola, drena. Não troca golpes — tece. Mantenha-a na teia, mirando quem tem memórias a perder. O grupo sente o relógio: cada rodada perde Experiências. Memórias roubadas ficam visíveis na teia (recuperáveis cortando). PJ sem nenhuma Experiência fica Vulnerável permanente — então ela cria pressão crescente. Recompense quem libertar as próprias memórias no meio da luta.", "reveal_death": "Ao morrer, a aranha solta todas as memórias presas de uma vez. Por um instante, a sala se enche das vidas de todos que já desceram.", "reveal_truth": "As memórias são o verdadeiro alimento da Boca — não a carne. Ela engole quem você FOI, não o seu corpo. E aqui está o segredo cruel: se um dia ninguém mais se lembrar da Boca, ela deixa de existir. Ela sobrevive porque vocês a temem o suficiente para voltar."}, {"n": 5, "nome": "O ECO DE TODOS", "conceito": "Uma criatura feita das vozes de cada pessoa que os PJs perderam, falando todas ao mesmo tempo.", "sb": {"Dif": 16, "Lim": "16/34", "PV": 9, "PF": 10, "ATQ": "+4", "arma": "Lamento (toda a sala, 2d10 sônico)"}, "mec": "Usa a voz dos mortos: cada PJ deve passar em Presença (15) pra atacar, ou perde a ação chorando. O Silenciado é imune e dá vantagem aos aliados.", "vox": "Mil vozes falam ao mesmo tempo, num corpo que é só rostos sobrepostos gritando. Ele não tem nome próprio. Ele é todos os que ninguém chorou.", "ataques": [["Coro dos Mortos", "área · 2d10 sônico/psíquico a todos; cada PJ ouve a voz de um morto seu."], ["Roubar a Voz", "perto · silencia o alvo (sem falar/conjurar) por 1 rodada e rouba sua voz."], ["Nome Esquecido", "mira quem ninguém vai chorar; 3d8 + o alvo 'esquece' uma carta até o fim da cena."]], "fases": [["Multidão", "Fala com mil vozes ao mesmo tempo, atacando a sanidade."], ["Súplica (1º limiar)", "Implora pra ser lembrado; se um PJ disser um nome real pra ele (dar-lhe identidade), perde uma ação — mas isso humaniza o final."]], "estrategia": "O Eco é desorientação pura — vozes sobrepostas, identidade nenhuma. Jogue-o como uma tempestade de saudade e ruído. Ele rouba vozes (silencia conjuradores) e mira os esquecidos. A reviravolta: ele só quer ser lembrado. Um grupo perceptivo pode 'derrotá-lo' dando-lhe um nome/identidade — um final melancólico em vez de sangrento. Deixe essa porta aberta sem forçá-la.", "reveal_death": "As mil vozes se calam, uma a uma, até sobrar uma só — a sua. Ela diz seu nome, e então silencia, grata.", "reveal_truth": "O Eco era feito de todos que desceram e ninguém chorou. Eles não queriam te matar — queriam ser LEMBRADOS. A Boca se alimenta do esquecimento. Quem desce e conta a história depois, lá em cima, tira uma migalha do prato dela. Sobreviver e CONTAR é a única vitória real."}, {"n": 6, "nome": "VAZIO ENCARNADO", "conceito": "O próprio Vazio tomou forma — um buraco com formato de gente que apaga o que toca.", "sb": {"Dif": 19, "Lim": "24/50", "PV": 14, "PF": 4, "ATQ": "+6", "arma": "Apagar (perto, 4d10, ignora Armadura)"}, "mec": "Dano dele não pode ser curado durante o combate (cicatriz do Vazio). Quem cai pra 0 PV é apagado da existência (não pode ser revivido).", "vox": "Há um buraco em forma de gente caminhando até vocês. Onde ele passa, não fica escuridão — não fica nada. Ele não mata. Ele apaga.", "ataques": [["Apagar", "perto · não causa dano: em acerto, o alvo testa ou tem um traço/memória/carta APAGADA da existência (some da ficha)."], ["Maré de Nada", "área · empurra todos e cria zonas de Vazio (quem entra é apagado)."]], "fases": [["A Ausência", "Não fala, não reage, só avança apagando."], ["Quase Nada (metade dos PV)", "Acelera; começa a apagar partes do próprio MAPA, reduzindo o espaço a nada."]], "estrategia": "O Vazio não luta — nega. Jogue-o silencioso e implacável, sem emoção. Ele não mata: apaga (traços, memórias, até pedaços do cenário). Isso aterroriza diferente de dano. O grupo não consegue 'conversar' nem intimidar — só resistir e derrubá-lo antes de ser apagado. Use parcimônia no Apagar (é pesado); a ameaça de perder algo da ficha já tensiona. É o chefe mais frio do jogo — o silêncio é a arma.", "reveal_death": "O buraco em forma de gente colapsa sobre si mesmo, e no centro, por um segundo, há uma luz pequena — a primeira em eras.", "reveal_truth": "O Vazio não é o oposto da vida. É o que sobra quando o significado é arrancado. Ele apaga porque foi apagado primeiro. Aqui está a dica que custa caro: o Vazio não pode ser combatido com força — só com SENTIDO. Cada motivo verdadeiro que vocês trouxeram lá pra cima é uma arma contra ele."}, {"n": 7, "nome": "O SANTO AFOGADO", "conceito": "Um mártir que desceu há séculos pra salvar alguém e nunca subiu. Apodreceu em fé e ódio.", "sb": {"Dif": 17, "Lim": "20/40", "PV": 11, "PF": 7, "ATQ": "+5", "arma": "Bênção Reversa (distante, 3d12, cura o boss)"}, "mec": "Toda cura que os PJs fazem, ele rouba 1 ponto. A cada PJ ferido, ele recupera 1 PF. Fala com a voz de quem o grupo ama.", "vox": "O mártir encharcado se levanta, mantos sagrados em farrapos, auréola de osso. Ele desceu pra salvar alguém, há muito tempo. Falhou. E ficou.", "ataques": [["Bênção Afogada", "distante · 3d10 + cura a si mesmo metade do dano causado."], ["Mãos em Prece", "perto · 2d12, agarra (Restringido) 'pra salvar' o alvo afogando-o."], ["Martírio", "1x · sacrifica metade dos próprios PV pra causar o dobro a todos os PJs — a fé que se consome."]], "fases": [["O Mártir", "Luta convicto de que está salvando o grupo da Boca."], ["Fé Quebrada (1º limiar)", "Percebe que falhou de novo; ataca com desespero, sem se curar mais."]], "estrategia": "Ele é o espelho sombrio do Fiel e do Redentor — um herói que azedou. Jogue-o convicto de que ESTÁ certo, que afogar os PJs é salvá-los. Narre a tragédia. Mecanicamente se cura (atrito), então o grupo precisa de dano alto e rápido. O Martírio é o momento de pânico. Um PJ heroico pode tentar alcançá-lo com palavras (ele já foi como eles) — permita um vislumbre de redenção, mesmo que ele recuse.", "reveal_death": "O mártir afunda uma última vez, mas dessa vez sorri. 'Então era isso', ele murmura. 'Eu só precisava parar de tentar salvar a todos.'", "reveal_truth": "A fé não morre na Boca — ela AZEDA. Todo herói que desce pra salvar acaba se afogando na própria missão. A Boca usa a sua bondade contra você: quanto mais você quer proteger, mais ela tem pra tirar. Descer leve, sem o peso de salvar o mundo, é descer mais forte."}, {"n": 8, "nome": "A LÍNGUA", "conceito": "Literalmente a língua da Boca, destacada e viva, do tamanho de um dragão.", "sb": {"Dif": 18, "Lim": "22/44", "PV": 13, "PF": 6, "ATQ": "+5", "arma": "Engolir (perto, agarra + 3d12/turno digerindo)"}, "mec": "Ao agarrar um PJ, começa a engoli-lo: 3 turnos preso = morto. Aliados precisam cortar a língua (10 de dano concentrado) pra soltar.", "vox": "A língua é do tamanho de um dragão, úmida, musculosa, escancarando uma bocarra de dentes. Ela já provou vocês lá em cima. Agora vai decidir.", "ataques": [["Provar", "muito perto · 4d10, e o alvo é 'saboreado' (a Língua aprende suas fraquezas: +1 contra ele dali em diante)."], ["Onda de Saliva", "área · terreno escorregadio + 2d8; quem cai é arrastado pra muito perto."], ["Engolir", "contra alvo já saboreado e ferido: tenta engolir (Dif alta); engolido sai no próximo turno tomando dano contínuo."]], "fases": [["O Paladar", "Saboreia o grupo, aprendendo fraquezas."], ["Faminta (1º limiar)", "Para de provar e começa a engolir — quer comer, não julgar."]], "estrategia": "A Língua é uma predadora sensorial — ela aprende o grupo enquanto luta (cada PJ 'provado' fica mais vulnerável). Jogue-a explorando fraquezas reveladas. O terreno (saliva) vira armadilha. Na segunda fase, a ameaça de ser engolido cria pânico real. Conecta com a sala 01-06 (O Gosto da Língua) — se o grupo passou por lá, narre o reconhecimento: 'ela lembra do seu sabor'.", "reveal_death": "A língua se enrola sobre si mesma e se dissolve em saliva. No chão, fica escrito, em muco: 'EU SÓ QUERIA SENTIR O GOSTO DE ALGO NOVO.'", "reveal_truth": "A Boca não te odeia. Ela está ENTEDIADA — há eras provando o mesmo medo, a mesma dor, a mesma ganância. Por isso ela reúne estranhos de mundos diferentes: ela quer um sabor inédito. Façam algo que ela nunca provou — uma escolha que nenhum grupo fez antes — e vocês a confundem."}, {"n": 9, "nome": "GÊMEOS DE CARNE", "conceito": "Dois irmãos fundidos pelas costas que a Boca uniu numa só criatura. Brigam entre si e contra vocês.", "sb": {"Dif": 16, "Lim": "18/36 (x2)", "PV": "8+8", "PF": 6, "ATQ": "+5", "arma": "Duas mãos (2 ataques de 3d10/turno)"}, "mec": "São dois alvos de PV separados. Matar um deixa o outro Enfurecido (dobra o dano). Agem 2x por rodada (turnos separados).", "vox": "Dois irmãos, fundidos costas com costas num só corpo de quatro braços, brigando entre si enquanto avançam. O deus que discorda de si mesmo.", "ataques": [["Golpe Discordante", "dois ataques · 2d8+4 cada, um de cada irmão, em alvos diferentes."], ["Briga Interna", "os irmãos se atacam e o dano respinga em área (caótico, imprevisível)."], ["Sincronia Forçada", "1x · quando concordam, um golpe combinado de 4d10 num único alvo."]], "fases": [["Discórdia", "Os dois brigam entre si; ataques dispersos, imprevisíveis."], ["Acordo Terrível (1º limiar)", "Param de brigar e atacam juntos — muito mais letais e coordenados."]], "estrategia": "Jogue a discórdia: os dois irmãos se odeiam, então no início atacam de forma caótica, até um ao outro. O grupo pode EXPLORAR isso — provocar a briga (roleplay/táticas) pra mantê-los divididos. Mas se forçados a 'concordar' (ou se o grupo os ignora), eles se sincronizam e viram uma ameaça dobrada. A tática do grupo é mantê-los brigando. Dê pistas dessa fraqueza.", "reveal_death": "Os dois irmãos, ao caírem, finalmente se voltam um para o outro. Morrem de mãos dadas, em paz, depois de eras brigando.", "reveal_truth": "Eles eram um só, divididos pela Boca, postos a lutar contra si mesmos para a diversão dela. É o que ela faz com TODO grupo: vira culpa contra amor, medo contra coragem, um Quebrado contra o outro. Um grupo que desce UNIDO e recusa se dividir é o pesadelo dela. A união é a única coisa que ela não consegue digerir."}, {"n": 10, "nome": "O COLECIONADOR", "conceito": "Uma entidade elegante que 'compra' aventureiros pra sua coleção. Quer vocês vivos — empalhados.", "sb": {"Dif": 18, "Lim": "20/42", "PV": 11, "PF": 8, "ATQ": "+6", "arma": "Anzol de Alma (distante, 2d12, puxa o alvo)"}, "mec": "Não mata: reduz a 0 PV e 'guarda' o PJ numa redoma (sai do combate). Resgatar exige quebrar a redoma (15 de dano). Se todos forem guardados, fim.", "vox": "Uma figura alta e elegante, sem rosto, em trajes finos e rasgados, segurando ganchos e redomas de vidro. 'Você é tão raro. Deixe-me guardar você assim.'", "ataques": [["Gancho de Alma", "distante · 2d10 + marca o alvo como 'peça desejada'."], ["Redoma", "contra alvo marcado e ferido: tenta aprisioná-lo vivo numa redoma (fora de combate até quebrarem, Dif 16)."], ["Apreço Cruel", "'admira' um PJ; ele fica Vulnerável (o olhar do Colecionador desarma)."]], "fases": [["O Curador", "Quer preservar os belos/raros, não matar; aprisiona em vez de ferir."], ["Coleção Ameaçada (1º limiar)", "Se um PJ aprisionado é libertado, enfurece — passa a querer destruir o que não pode ter."]], "estrategia": "Ele é elegante, educado, aterrorizante — não quer matar, quer COLECIONAR. Jogue-o cortês, elogiando os PJs enquanto tenta aprisioná-los vivos. O horror é a imortalidade como vitrine. Mecanicamente, tira PJs do combate (redomas), forçando resgates. Mire os 'mais raros' (o PJ mais singular do grupo). Se libertarem uma peça, ele perde a compostura — narre a virada de fino pra furioso.", "reveal_death": "O Colecionador abre todas as suas redomas antes de partir, libertando séculos de premiados. 'Talvez', ele diz, 'guardar não fosse amar.'", "reveal_truth": "Ele preservava o belo aprisionando-o — matando o que admirava pra que nunca mudasse. A Boca faz o mesmo com o mundo: ela engoliu eras inteiras pra que nada nunca mais terminasse, congelando o fim num eterno digerir. Parar a Boca talvez não seja destruí-la, mas deixá-la, enfim, TERMINAR."}, {"n": 11, "nome": "A FORNALHA VIVA", "conceito": "O coração ardente da Boca, onde as almas viram fogo. Um titã de chamas e correntes.", "sb": {"Dif": 18, "Lim": "22/46", "PV": 13, "PF": 5, "ATQ": "+6", "arma": "Erupção (toda a sala, 3d12 fogo)"}, "mec": "A sala esquenta a cada rodada: +1 de dano em tudo cumulativo. Após 5 rodadas, explode (5d12 em todos). O Arauto pode redirecionar a explosão.", "vox": "Um titã de fogo e correntes se ergue, e dentro do seu corpo derretido há almas gritando. Alguém tem de arder pra Boca não esfriar. Hoje, é ele. Amanhã, vocês.", "ataques": [["Sopro de Almas", "área · 3d8 fogo + as almas gritam (1 Estresse a todos)."], ["Corrente Ardente", "distante · 2d10 fogo, puxa o alvo pra adjacente (e pra Aura)."], ["Alimentar a Fornalha", "tenta jogar um PJ ferido em si mesma como combustível (Dif alta; muito dano contínuo)."]], "fases": [["O Necessário", "Arde por dever — alguém tem de queimar pra Boca viver."], ["Esfriando (metade dos PV)", "Desesperada pra não apagar, tenta consumir tudo — mais agressiva e imprudente."]], "estrategia": "Conecta com a sala 66-70 (Fornalha de Almas). Ela não é cruel — é fatalista: alguém PRECISA arder. Jogue-a com essa lógica trágica ('hoje sou eu, amanhã quem você ama'). Aura de calor cumulativa pressiona o tempo. A ameaça de virar combustível aterroriza. As almas dentro dela podem ser libertadas (aliados temporários) se o grupo apagar partes — recompense a misericórdia. Vulnerável a frio.", "reveal_death": "A fornalha apaga, e pela primeira vez em eras, faz frio na Boca. As almas libertas sobem como fagulhas, finalmente.", "reveal_truth": "Alguém sempre teve que arder pra Boca seguir viva — almas como lenha, eternamente. Mas a verdade que a fornalha esconde é esta: a Boca não PRECISA queimar ninguém. Ela só não sabe como parar. Ninguém nunca ensinou o fim a ela. Talvez seja isso que vocês desçam pra fazer — não matá-la, mas mostrar-lhe como acabar."}, {"n": 12, "nome": "NADA", "conceito": "O fundo está vazio. Não há chefe. Só o silêncio, e a certeza de que a Boca já venceu — porque vocês desceram por vontade própria, e ela alimenta-se disso.", "sb": {"Dif": "—", "Lim": "—", "PV": "—", "PF": "—", "ATQ": "—", "arma": "—"}, "mec": "Não há luta. A Boca oferece a cada PJ exatamente o que ele desceu buscar — pelo preço de nunca mais subir. Cada jogador decide: aceitar e ficar, ou recusar e escalar de volta com as mãos vazias. O verdadeiro chefe é a escolha.", "vox": "Não há nada. Onde deveria estar o horror final, há só um abismo de silêncio. A Deusa da Fome comeu o mundo inteiro e ainda assim morreu faminta. Isto é o que sobrou.", "ataques": [["—", "Não há combate. Não há criatura. Há uma escolha."]], "fases": [["O Silêncio", "O grupo chega ao fundo e não encontra horror — encontra o vazio que a Deusa da Fome deixou ao morrer faminta."], ["A Escolha", "Ficar (e tornar-se parte da Boca, herdando a fome) ou subir (voltar vazio, mas vivo). Não há dado. Há consequência."]], "estrategia": "O clímax mais difícil de mestrar — porque não se mestra, se conduz. Não role nada. Descreva o fundo: o cadáver imenso da Deusa da Fome, a quietude absoluta, a fome que sobrou e que agora é a Boca inteira. Apresente a escolha a cada PJ individualmente (ligando ao motivo que deram na abertura). Quem fica vira lenda/horror da próxima descida. Quem sobe carrega o vazio. Deixe o silêncio fazer o trabalho — não preencha. É o eco da pergunta de abertura: 'por que você entrou na Boca?'. Aqui ela é respondida.", "reveal_death": "Não há corpo, não há morte, não há triunfo. Só o vazio onde a Deusa da Fome esteve. E, se vocês ficarem quietos o bastante, um sussurro: 'Obrigada por descer. Eu odiava estar sozinha.'", "reveal_truth": "Esta é a última verdade, a que todas as outras cercavam: a Boca do Mundo é a SOLIDÃO de um deus que comeu tudo e não sobrou ninguém para amá-lo. Ela engole para ter companhia. Pará-la não é matar nem fugir — é o impensável: alguém DESCER por vontade própria, olhar o nada nos olhos, e escolher ficar. Não como alimento. Como companhia. Nenhum grupo nunca fez isso. Talvez o seu seja o primeiro. Talvez seja por isso que vocês desceram."}], "tesouros": [{"n": 1, "nome": "O Dente da Boca", "uso": "Uma presa de marfim negro arrancada da própria parede. Arma improvisada: corpo a corpo, 1d12+2 mágico.", "preco": "Cada vez que mata com ele, você sente fome — marque 1 Estresse e descreva o que deseja devorar."}, {"n": 2, "nome": "Frasco de Lágrimas Divinas", "uso": "Bebê-o pra recuperar todos os PV e PF de uma vez. Uso único.", "preco": "Você chora as lágrimas de um deus morto pelo resto da sessão. Desvantagem em testes sociais — ninguém aguenta sua tristeza."}, {"n": 3, "nome": "O Olho Decepado", "uso": "Um olho que cabe na palma. Uma vez por descanso, veja através de uma parede ou de uma sala adiante.", "preco": "Ele também vê você. O mestre ganha 1 Ponto de Medo sempre que você o usa."}, {"n": 4, "nome": "Moeda de Dois Mundos", "uso": "Uma moeda que nunca cai do mesmo lado. Uma vez por sessão, force um reroll de qualquer dado (seu ou de um inimigo).", "preco": "Quem a guarda atrai a ganância da Boca: você não pode largá-la, nem dá-la. Ela sempre volta ao seu bolso."}, {"n": 5, "nome": "Cordas Vocais de Prata", "uso": "Um colar feito de cordas vocais cristalizadas. +2 em testes de Presença para persuadir, comandar ou cantar.", "preco": "Sua própria voz enfraquece em troca: sussurros viram o normal; você não consegue mais gritar."}, {"n": 6, "nome": "Mapa de Carne", "uso": "Um pedaço de pele tatuado que se redesenha. Uma vez por andar, saiba o tipo da próxima sala antes de descer.", "preco": "O mapa cresce na sua pele. A cada uso, ele cobre mais de você — puramente cosmético, mas perturbador."}, {"n": 7, "nome": "O Coração que Bate Por Dois", "uso": "Um coração ainda quente numa caixa. Ligue-o a um aliado caído (0 PV): ele volta com 1 PV.", "preco": "Vocês passam a compartilhar dano: metade do que um sofre, o outro também marca, até o próximo descanso longo."}, {"n": 8, "nome": "Cinzas do Profeta", "uso": "Um punhado de cinzas num saquinho. Jogue-as ao ar pra ter uma visão verdadeira do futuro próximo (pergunte 1 sim/não ao mestre).", "preco": "A profecia sempre se cumpre — mas nunca como você esperava. O mestre escolhe como ela se torce."}, {"n": 9, "nome": "Luva do Afanador Morto", "uso": "Pertenceu a um ladrão que desceu antes. +2 em testes de Acuidade para furtar, abrir fechaduras ou desarmar.", "preco": "A mão dentro dela não é mais totalmente sua. Uma vez por sessão, o mestre decide o que ela rouba sem você querer."}, {"n": 10, "nome": "Escama da Serpente do Fundo", "uso": "Uma escama maior que um escudo. Use como armadura improvisada: +3 de Armadura por uma cena.", "preco": "Ela está viva e fria. Enquanto a carrega, criaturas do Vazio sabem exatamente onde você está."}, {"n": 11, "nome": "O Sino Sem Som", "uso": "Um sino que toca em silêncio absoluto. Toque-o pra impor Silêncio numa sala inteira por 1 minuto (anula magias verbais e sônicas).", "preco": "Você também fica mudo durante o efeito. E algo, em algum lugar, sempre responde ao toque."}, {"n": 12, "nome": "Vela de Sebo de Mártir", "uso": "Uma vela que arde sem se consumir. Sua luz acalma: aliados próximos recuperam 1 PF por rodada que ela queima.", "preco": "A luz revela o que está escondido — inclusive os monstros que preferiam o escuro. Combates começam com a Boca alerta."}, {"n": 13, "nome": "Anel de Quem Você Foi", "uso": "Um anel simples que mostra um reflexo da sua vida antes da Boca. Uma vez, refaça uma rolagem somando +1d6.", "preco": "Cada uso apaga uma memória boa sua de verdade (perca 1 Experiência permanentemente)."}, {"n": 14, "nome": "Garras Emprestadas", "uso": "Luvas com garras de uma fera abatida. Ataque desarmado vira 1d10+3 e deixa o alvo Vulnerável.", "preco": "As garras querem caçar. Fora de combate por muito tempo, você marca Estresse até as usar de novo."}, {"n": 15, "nome": "Pão dos Mortos", "uso": "Um pão que nunca mofa, feito de trigo de um mundo que não existe mais. Comê-lo conta como um descanso curto.", "preco": "Quem come sonha com a vida de quem plantou o trigo — e acorda achando que essas memórias são suas."}, {"n": 16, "nome": "O Espelho de Bolso", "uso": "Um caco do Espelho Rachado. Uma vez, mostre a um inimigo a versão dele que poderia ter sido: ele perde a próxima ação, hesitando.", "preco": "Não funciona em quem não tem remorso. E o caco também te mostra a sua pior versão, toda vez."}, {"n": 17, "nome": "Corrente de Âncora", "uso": "Uma corrente pesada que prende você ao chão. Enquanto ancorado, não pode ser empurrado, puxado ou movido à força. +2 limiares.", "preco": "Você também não pode se mover voluntariamente até soltá-la (1 ação). Na Boca, ficar parado é perigoso."}, {"n": 18, "nome": "Semente do Jardim de Carne", "uso": "Uma semente úmida e quente. Plante-a pra criar cobertura/barreira de carne (parede temporária) ou um aliado-broto (Lacaio Patamar 1).", "preco": "O que cresce dela é leal à Boca, não a você. Há 1 chance em 6 dele se virar contra o grupo a cada rodada."}, {"n": 19, "nome": "A Última Carta", "uso": "Uma carta de baralho em branco. Escreva nela o nome de um morto e queime-a: ele te responde uma única pergunta do além.", "preco": "O morto também pode pedir algo em troca. Recusar custa caro; aceitar, mais ainda."}, {"n": 20, "nome": "Fragmento do Fundo", "uso": "Um caco de pura escuridão que pesa como uma montanha. É a saída: quem o leva até a superfície pode SUBIR da Boca. O único jeito de escapar de verdade.", "preco": "A Boca quer ele de volta. Carregá-lo atrai TODOS os horrores restantes. É a fuga e a sentença ao mesmo tempo."}]};
const NS='com.boca-do-mundo';
const K={fear:NS+'/fear', hunger:NS+'/hunger', sheetPrefix:NS+'/sheet-'};
const CH={card:NS+'/card', notify:NS+'/notify', banner:NS+'/banner'};
const SRC=NS+'.mestre';
const DP={req:'dice-plus/roll-request', ready:'dice-plus/isReady', res:SRC+'/roll-result', err:SRC+'/roll-error'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const randInt=m=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%m+1}catch(e){return Math.floor(Math.random()*m)+1}};

let demo=!OBR.isAvailable, meta={}, metaSubs=[], bcSubs={};
const api={
 async ready(){ if(demo){$('demoNote').style.display='block';return} await new Promise(r=>OBR.onReady(r)) },
 async me(){ if(demo) return {id:'gm',name:'Mestre',role:'GM'};
   return {id:await OBR.player.getId(),name:await OBR.player.getName(),role:await OBR.player.getRole()} },
 async getMeta(){ return demo?meta:OBR.room.getMetadata() },
 async setMeta(u){ if(demo){Object.assign(meta,u);metaSubs.forEach(f=>f(meta));return} return OBR.room.setMetadata(u) },
 onMeta(f){ demo?metaSubs.push(f):OBR.room.onMetadataChange(f) },
 send(ch,d,dest='ALL'){ if(demo){(bcSubs[ch]||[]).forEach(f=>f({data:d}));return} OBR.broadcast.sendMessage(ch,d,{destination:dest}) },
 on(ch,f){ demo?(bcSubs[ch]=bcSubs[ch]||[]).push(f):OBR.broadcast.onMessage(ch,f) },
 notify(m,v='DEFAULT'){ demo?toast(m):OBR.notification.show(m,v).catch(()=>{}) },
 badge(t,c){ if(demo)return; OBR.action.setBadgeText(t||undefined).catch(()=>{}); if(c)OBR.action.setBadgeBackgroundColor(c).catch(()=>{}) },
};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)}

let ME={id:'gm',name:'Mestre'}, fear=0, fome=0, target='everyone', dpOK=false, bannerOn=false;

/* Dice+ */
const _pings={};
api.on(DP.ready,ev=>{const d=ev.data;if(d&&d.ready&&_pings[d.requestId]){_pings[d.requestId]();delete _pings[d.requestId]}});
function pingDP(){return new Promise(res=>{ if(demo){res(false);return}
  const id='p'+Date.now()+'-'+randInt(999); _pings[id]=()=>res(true);
  api.send(DP.ready,{requestId:id,timestamp:Date.now()},'LOCAL');
  setTimeout(()=>{if(_pings[id]){delete _pings[id];res(false)}},2500);
})}
const pend={};
api.on(DP.res,ev=>{const d=ev.data;const h=pend[d?.rollId];if(h){delete pend[d.rollId];h.ok(d.result)}});
api.on(DP.err,ev=>{const d=ev.data;const h=pend[d?.rollId];if(h){delete pend[d.rollId];h.fail(d.error)}});
function dpRoll(notation){return new Promise((ok,fail)=>{
  const rollId='mesa-'+Date.now()+'-'+randInt(999); pend[rollId]={ok,fail};
  api.send(DP.req,{rollId,playerId:ME.id,playerName:ME.name,rollTarget:target,
    diceNotation:notation,showResults:true,timestamp:Date.now(),source:SRC},'LOCAL');
  setTimeout(()=>{if(pend[rollId]){delete pend[rollId];fail('timeout')}},9000);
})}
async function roll(notation,label){
  let total=null, via='Dice+';
  if(dpOK){ try{ const r=await dpRoll(notation+(label?` #${label}`:'')); total=r.totalValue;
    if(!total&&r.groups) total=r.groups.reduce((s,g)=>s+(g.isNegative?-g.total:g.total),0);
  }catch(e){} }
  if(total==null){ via='interna';
    total=0; const re=/(\d+)d(\d+)|([+\-]\d+)(?!d)/g; let m;
    while((m=re.exec(notation))){ if(m[1]){for(let i=0;i<+m[1];i++)total+=randInt(+m[2])} else total+=parseInt(m[3]); }
  }
  const lr=$('lastroll'); lr.classList.add('on');
  lr.innerHTML=`<b style="font-size:17px;color:var(--blood2)">${total}</b> — ${esc(label||notation)} <span class="small">(${esc(notation)} · ${via}${target==='gm_only'?' · oculta':''})</span>`;
  return total;
}

/* medo & fome */
async function setFear(v){ fear=Math.max(0,Math.min(12,v)); await api.setMeta({[K.fear]:fear}); }
async function setFome(v){ fome=Math.max(0,Math.min(6,v)); await api.setMeta({[K.hunger]:fome}); }
$('fPlus').onclick=()=>setFear(fear+1);
$('fMinus').onclick=()=>setFear(fear-1);
const segs=$('segs');
for(let i=0;i<6;i++){const s=document.createElement('div');s.className='seg';s.onclick=()=>setFome(fome===i+1?i:i+1);segs.appendChild(s)}
function paint(m){
  fear=m[K.fear]||0; fome=m[K.hunger]||0;
  $('fearV').textContent=fear;
  document.querySelectorAll('.seg').forEach((s,i)=>s.classList.toggle('on',i<fome));
  $('fomeTxt').textContent=fome>=6?'— A BOCA ACORDOU':`(${fome}/6)`;
  api.badge(fear>0?String(fear):undefined,'#a8312a');
  renderParty(m);
}

/* party */
function renderParty(m){
  const list=Object.entries(m).filter(([k])=>k.startsWith(K.sheetPrefix)).map(([,v])=>v)
    .filter(v=>v&&v.ts&&Date.now()-v.ts<1000*60*60*8);
  const el=$('party');
  if(!list.length){el.innerHTML='<div class="empty">Nenhum Quebrado conectado ainda.<br>Os jogadores aparecem aqui ao escolherem a ficha.</div>';return}
  el.innerHTML=list.map(v=>{
    const bar=(l,val,max,c)=>`<div class="bar"><div class="bl">${l}</div><div class="bb"><div class="bf" style="--bc:${c};width:${max?Math.round(100*val/max):0}%"></div></div><div class="bv">${val}/${max}</div></div>`;
    return `<div class="pj" style="--pc:${esc(v.cor||'#a8312a')}">
      <div class="hd"><b>${esc(v.nome)}</b><span>${esc(v.player||'')}</span></div>
      ${bar('PV',v.pv,v.pvMax,'var(--blood2)')}
      ${bar('Fadiga',v.fad,v.fadMax,'var(--roxo)')}
      ${bar('Armadura',v.pa,v.paMax,'#8a7d6a')}
      ${bar('Esperança',v.esp,6,'var(--hope)')}
    </div>`;}).join('');
}

/* bestiário */
const diceRe=/(\d+d\d+(?:[+\-]\d+)?)/;
function atkBtns(prefix,nome,txt,atq){
  const d=(txt.match(diceRe)||[])[1];
  let b='';
  if(atq!=null) b+=`<button class="rollbtn" data-r="1d20${atq>=0?'+':''}${atq}" data-l="${esc(nome)} · ataque">d20${atq>=0?'+':''}${atq}</button>`;
  if(d) b+=`<button class="rollbtn" data-r="${d}" data-l="${esc(nome)} · dano">${d}</button>`;
  return b;
}
function parseAtq(stat){ const m=(stat||'').match(/ATQ\s*([+\-]\d+)/); return m?parseInt(m[1]):null }
function renderBest(){
  $('bestList').innerHTML=DATA.inimigos.map(e=>{
    const atq=parseAtq(e.stat);
    const atks=(e.ataques||[]).map(a=>`<div class="atk"><div class="an"><b>${esc(a[0])}</b> — <span>${esc(a[1])}</span></div>${atkBtns('',e.nome+' · '+a[0],a[1],null)}</div>`).join('');
    const habs=(e.habilidades||[]).map(h=>`<li><b>${esc(h[0])}</b> — ${esc(h[1])}</li>`).join('');
    return `<div class="en">
      <div class="hd"><b>${esc(e.nome)}</b><span>${esc(e.tier)}</span></div>
      <div class="st">${esc(e.stat)} ${atq!=null?`<button class="rollbtn" style="margin-left:6px" data-r="1d20${atq>=0?'+':''}${atq}" data-l="${esc(e.nome)} · ataque">ATAQUE d20${atq>=0?'+':''}${atq}</button>`:''}</div>
      <div class="vox">${esc(e.vox||e.leitura||'')}</div>
      ${atks}
      <details class="x"><summary>habilidades &amp; como jogar</summary><ul>${habs}</ul><p style="background:rgba(127,170,74,.07);border-radius:4px;padding:7px 9px;margin-top:7px">${esc(e.estrategia||'')}</p></details>
    </div>`;}).join('');
}
function renderBoss(){
  $('bossList').innerHTML=DATA.bosses.map(b=>{
    const sb=b.sb||{};
    const atq=(''+(sb.ATQ||'')).match(/[+\-]\d+/)?parseInt(sb.ATQ):null;
    const stat=sb.PV&&sb.PV!=='—'?`Dif ${sb.Dif} · Lim ${sb.Lim} · PV ${sb.PV} · PF ${sb.PF} · ATQ ${sb.ATQ}`:'Sem combate — o chefe é a escolha';
    const armaD=((sb.arma||'').match(diceRe)||[])[1];
    const atks=(b.ataques||[]).map(a=>{
      const d=((a[1]||'').match(diceRe)||[])[1];
      return `<div class="atk"><div class="an"><b>${esc(a[0])}</b> — <span>${esc(a[1])}</span></div>${d?`<button class="rollbtn" data-r="${d}" data-l="${esc(b.nome)} · ${esc(a[0])}">${d}</button>`:''}</div>`}).join('');
    const fases=(b.fases||[]).map(f=>`<li><b>${esc(f[0])}</b> — ${esc(f[1])}</li>`).join('');
    return `<div class="en boss">
      <div class="hd"><b>${b.n}. ${esc(b.nome)}</b></div>
      <div class="st">${esc(stat)}
        ${atq!=null?`<button class="rollbtn" style="margin-left:6px" data-r="1d20${atq>=0?'+':''}${atq}" data-l="${esc(b.nome)} · ataque">ATAQUE</button>`:''}
        ${armaD?`<button class="rollbtn" data-r="${armaD}" data-l="${esc(b.nome)} · ${esc((sb.arma||'').split('(')[0].replace('Ataque:','').trim())}">${armaD}</button>`:''}
      </div>
      <div class="vox">${esc(b.vox||'')}</div>
      <div class="small" style="margin-bottom:5px">${esc(b.conceito||'')}</div>
      ${atks}
      <details class="x"><summary>fases · brutalidade · como jogar</summary>
        <ul>${fases}</ul>
        <p><b>Brutalidade:</b> ${esc(b.mec||'')}</p>
        <p style="background:rgba(127,170,74,.07);border-radius:4px;padding:7px 9px">${esc(b.estrategia||'')}</p>
      </details>
      ${b.reveal_truth?`<details class="x reveal"><summary>⚜ ao vencer — revelação (só abra ao derrotar)</summary>
        <p class="rv-death">${esc(b.reveal_death||'')}</p><p class="rv-truth">${esc(b.reveal_truth)}</p>
        <p style="margin-top:7px"><button class="btn gold" data-reveal="${b.n}">Mostrar revelação a todos</button></p></details>`:''}
    </div>`;}).join('');
}
